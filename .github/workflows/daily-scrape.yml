name: Daily Stock Data Scrape

on:
  schedule:
    - cron: '0 14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      IST_DATE: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install curl_cffi beautifulsoup4

      - name: Get IST date
        run: echo "IST_DATE=$(TZ='Asia/Kolkata' date +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Scrape Chartink
        run: python3 scripts/scrape_chartink.py > /tmp/stocks.json

      - name: Validate scrape
        run: |
          python3 -c "
          import json, sys
          with open('/tmp/stocks.json') as f:
              data = json.load(f)
          if isinstance(data, dict) and 'error' in data:
              print('SCRRAPE_ERROR: ' + data['error'])
              sys.exit(1)
          print(f'OK: {len(data)} stocks')
          "

      - name: Save to DB
        run: |
          python3 << 'PYEOF'
          import json, urllib.request

          with open('/tmp/stocks.json') as f:
              stocks = json.load(f)

          payload = json.dumps({"date": "${{ env.IST_DATE }}", "stocks": stocks}).encode()
          req = urllib.request.Request(
              "https://stockh.vercel.app/api/backfill",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST"
          )
          try:
              resp = urllib.request.urlopen(req, timeout=30)
              print(f"DB save: {resp.status} - {resp.read().decode()}")
          except Exception as e:
              print(f"DB save failed: {e}")
          PYEOF

      - name: Update static file and push
        run: |
          python3 << 'PYEOF'
          import json, subprocess
          from datetime import datetime, timezone, timedelta

          with open('/tmp/stocks.json') as f:
              stocks = json.load(f)

          ist = timezone(timedelta(hours=5, minutes=30))
          now = datetime.now(ist).isoformat()

          static = {
              "stocks": stocks,
              "tradingDate": "${{ env.IST_DATE }}",
              "lastUpdated": now,
              "source": "chartink_eod_scanner"
          }

          with open('public/data/stocks.json', 'w') as f:
              json.dump(static, f, indent=2)
          print(f"Updated stocks.json: {len(stocks)} stocks")
          PYEOF

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/stocks.json
          git diff --cached --quiet || (git commit -m "Daily scrape: ${{ env.IST_DATE }}" && git push)
