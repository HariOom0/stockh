name: Daily Stock Data Scrape

on:
  schedule:
    # 7:30 PM IST = 14:00 UTC (runs Mon-Fri)
    - cron: '0 14 * * 1-5'
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install curl_cffi beautifulsoup4

      - name: Get today's IST date
        id: date
        run: |
          IST_DATE=$(TZ='Asia/Kolkata' date +%Y-%m-%d)
          echo "date=$IST_DATE" >> $GITHUB_OUTPUT
          echo "Today (IST): $IST_DATE"

      - name: Scrape Chartink Volume Shockers
        id: scrape
        run: |
          python3 scripts/scrape_chartink.py > /tmp/stocks_raw.json 2>&1
          
          # Check if it's valid JSON array
          python3 -c "
          import json, sys
          with open('/tmp/stocks_raw.json') as f:
              data = json.load(f)
          if isinstance(data, dict) and 'error' in data:
              print(f'ERROR: {data["error"]}')
              sys.exit(1)
          if not isinstance(data, list) or len(data) == 0:
              print('ERROR: No stocks scraped')
              sys.exit(1)
          print(f'OK: {len(data)} stocks scraped')
          "

      - name: Save to database via API
        env:
          BACKFILL_URL: 
        run: |
          IST_DATE="${{ steps.date.outputs.date }}"
          
          # Build the payload
          python3 -c "
          import json
          from datetime import datetime, timezone, timedelta
          
          with open('/tmp/stocks_raw.json') as f:
              stocks = json.load(f)
          
          ist = timezone(timedelta(hours=5, minutes=30))
          now = datetime.now(ist).isoformat()
          
          payload = {
              'date': '$IST_DATE',
              'stocks': stocks,
              'tradingDate': '$IST_DATE',
              'lastUpdated': now
          }
          
          # Save payload for next step
          with open('/tmp/stocks_payload.json', 'w') as f:
              json.dump(payload, f)
          
          print(f'Prepared payload: {len(stocks)} stocks for $IST_DATE')
          "

      - name: Call backfill API to save to database
        env:
          SITE_URL: 
        run: |
          IST_DATE="${{ steps.date.outputs.date }}"
          
          # Extract just date and stocks for the backfill endpoint
          python3 -c "
          import json
          with open('/tmp/stocks_payload.json') as f:
              payload = json.load(f)
          
          backfill_payload = {
              'date': payload['date'],
              'stocks': payload['stocks']
          }
          
          with open('/tmp/backfill_payload.json', 'w') as f:
              json.dump(backfill_payload, f)
          "
          
          # Call the backfill API
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.SITE_URL || 'https://stockh.vercel.app' }}/api/backfill" \
            -H "Content-Type: application/json" \
            -d @/tmp/backfill_payload.json)
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          
          echo "API Response ($HTTP_CODE): $BODY"
          
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "WARNING: Backfill API failed. Data will be saved via static file on next deploy."
          fi

      - name: Update static JSON file
        run: |
          IST_DATE="${{ steps.date.outputs.date }}"
          
          python3 -c "
          import json
          with open('/tmp/stocks_payload.json') as f:
              payload = json.load(f)
          
          static = {
              'stocks': payload['stocks'],
              'tradingDate': payload['tradingDate'],
              'lastUpdated': payload['lastUpdated'],
              'source': 'chartink_eod_scanner'
          }
          
          with open('public/data/stocks.json', 'w') as f:
              json.dump(static, f, indent=2)
          
          print(f'Updated stocks.json: {len(payload["stocks"])} stocks for $IST_DATE')
          "

      - name: Commit and push updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/stocks.json
          git diff --cached --quiet || git commit -m "Daily scrape: ${{ steps.date.outputs.date }} ($(TZ='Asia/Kolkata' date +%H:%M) IST)"
          git push
